# Model
d_model: 128           # hidden size
n_heads: 8
n_layers: 4
ff_mult: 4
dropout: 0.1
max_len: 1024          # >= your window length T
mask_ratio: 0.15       # fraction of time steps to mask during pretraining
mask_span: 8           # contiguous span length for span-masking

# Training
batch_size: 64
lr: 3e-4
weight_decay: 1e-4
max_epochs_pretrain: 50
max_epochs_finetune: 30
precision: 16          # use 32 if no AMP
devices: 1
accumulate_grad_batches: 1

# Data
window_length: 256     # T
num_features: 40       # D (set to your feature count)
train_npz: data/ngafid_windows_trainvaltest.npz  # point to your prepared file(s)
# Alternatively set directories:
# pretrain_dir: data/pretrain_windows/
# finetune_dir: data/finetune_windows/

# Output
outdir: Existing Methods/TS-Bert/outputs
ckptdir: Existing Methods/TS-Bert/checkpoints
logdir: Existing Methods/TS-Bert/logs
